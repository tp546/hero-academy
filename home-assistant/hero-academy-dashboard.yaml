title: Hero Academy
views:
  - title: Mission Control
    path: hero-academy
    icon: mdi:shield-star
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: markdown
            content: |
              # 🦸 HERO ACADEMY
              **MISSION CONTROL**
          - type: entity
            entity: sensor.hero_mission_manager_pending_approvals
            name: Parent Approvals
            icon: mdi:clipboard-check-outline
          - type: entity
            entity: sensor.hero_mission_manager_status
            name: Mission Status

      - type: grid
        column_span: 3
        cards:
          - type: vertical-stack
            cards:
              - type: markdown
                content: |
                  ## 🔴 ZACH
                  **{{ states('sensor.zach_hero_profile_rank') }}**
              - type: glance
                columns: 4
                entities:
                  - entity: sensor.zach_hero_profile_level
                    name: Level
                  - entity: sensor.zach_hero_profile_xp
                    name: XP
                  - entity: sensor.zach_hero_profile_coins
                    name: Coins
                  - entity: sensor.zach_hero_profile_completed_today
                    name: Today
              - type: grid
                columns: 4
                square: false
                cards:
                  - type: button
                    name: Clean Up
                    icon: mdi:broom
                    entity: button.zach_clean_up
                  - type: button
                    name: Teeth AM
                    icon: mdi:toothbrush
                    entity: button.zach_brush_teeth_am
                  - type: button
                    name: Teeth PM
                    icon: mdi:toothbrush
                    entity: button.zach_brush_teeth_pm
                  - type: button
                    name: Gecko
                    icon: mdi:ladybug
                    entity: button.zach_feed_gecko
                  - type: button
                    name: Make Bed
                    icon: mdi:bed
                    entity: button.zach_make_bed
                  - type: button
                    name: Fighting
                    icon: mdi:hand-back-right
                    entity: button.zach_fighting
                  - type: button
                    name: Talking Back
                    icon: mdi:chat-alert
                    entity: button.zach_talking_back
                  - type: button
                    name: Not Listening
                    icon: mdi:ear-hearing
                    entity: button.zach_not_listening

          - type: vertical-stack
            cards:
              - type: markdown
                content: |
                  ## 🔵 JOSH
                  **{{ states('sensor.josh_hero_profile_rank') }}**
              - type: glance
                columns: 4
                entities:
                  - entity: sensor.josh_hero_profile_level
                    name: Level
                  - entity: sensor.josh_hero_profile_xp
                    name: XP
                  - entity: sensor.josh_hero_profile_coins
                    name: Coins
                  - entity: sensor.josh_hero_profile_completed_today
                    name: Today
              - type: grid
                columns: 4
                square: false
                cards:
                  - type: button
                    name: Clean Up
                    icon: mdi:broom
                    entity: button.josh_clean_up
                  - type: button
                    name: Teeth AM
                    icon: mdi:toothbrush
                    entity: button.josh_brush_teeth_am
                  - type: button
                    name: Teeth PM
                    icon: mdi:toothbrush
                    entity: button.josh_brush_teeth_pm
                  - type: button
                    name: Gecko
                    icon: mdi:ladybug
                    entity: button.josh_feed_gecko
                  - type: button
                    name: Make Bed
                    icon: mdi:bed
                    entity: button.josh_make_bed
                  - type: button
                    name: Fighting
                    icon: mdi:hand-back-right
                    entity: button.josh_fighting
                  - type: button
                    name: Talking Back
                    icon: mdi:chat-alert
                    entity: button.josh_talking_back
                  - type: button
                    name: Not Listening
                    icon: mdi:ear-hearing
                    entity: button.josh_not_listening

          - type: vertical-stack
            cards:
              - type: markdown
                content: |
                  ## 🟡 CHARLIE
                  **{{ states('sensor.charlie_hero_profile_rank') }}**
              - type: glance
                columns: 4
                entities:
                  - entity: sensor.charlie_hero_profile_level
                    name: Level
                  - entity: sensor.charlie_hero_profile_xp
                    name: XP
                  - entity: sensor.charlie_hero_profile_coins
                    name: Coins
                  - entity: sensor.charlie_hero_profile_completed_today
                    name: Today
              - type: grid
                columns: 4
                square: false
                cards:
                  - type: button
                    name: Clean Up
                    icon: mdi:broom
                    entity: button.charlie_clean_up
                  - type: button
                    name: Teeth AM
                    icon: mdi:toothbrush
                    entity: button.charlie_brush_teeth_am
                  - type: button
                    name: Teeth PM
                    icon: mdi:toothbrush
                    entity: button.charlie_brush_teeth_pm
                  - type: button
                    name: Gecko
                    icon: mdi:ladybug
                    entity: button.charlie_feed_gecko
                  - type: button
                    name: Make Bed
                    icon: mdi:bed
                    entity: button.charlie_make_bed
                  - type: button
                    name: Fighting
                    icon: mdi:hand-back-right
                    entity: button.charlie_fighting
                  - type: button
                    name: Talking Back
                    icon: mdi:chat-alert
                    entity: button.charlie_talking_back
                  - type: button
                    name: Not Listening
                    icon: mdi:ear-hearing
                    entity: button.charlie_not_listening

      - type: grid
        column_span: 3
        cards:
          - type: vertical-stack
            cards:
              - type: markdown
                content: |
                  ## 📊 TODAY — ZACH
                  ⭐ Good: **{{ states('sensor.zach_hero_profile_today_good') }}** · 💥 Bad: **{{ states('sensor.zach_hero_profile_today_bad') }}**  
                  ⭐ XP: **{{ states('sensor.zach_hero_profile_today_xp_earned') }}** · 🪙 Change: **{{ states('sensor.zach_hero_profile_today_coin_change') }}**
              - type: markdown
                content: |
                  ### 📜 Recent Activity
                  {% for i in range(1,13) %}
                  {% set raw = states('sensor.zach_hero_profile_activity' ~ i) %}
                  {% if raw not in ['unknown','unavailable',''] %}
                  {% set a = raw | from_json %}
                  {% if a.type == 'bad' %}💥{% else %}⭐{% endif %} **{{ a.title }}** — {{ '%+d' | format(a.xp | int) }} XP / {{ '%+d' | format(a.coins | int) }} 🪙  
                  {% endif %}
                  {% endfor %}

          - type: vertical-stack
            cards:
              - type: markdown
                content: |
                  ## 📊 TODAY — JOSH
                  ⭐ Good: **{{ states('sensor.josh_hero_profile_today_good') }}** · 💥 Bad: **{{ states('sensor.josh_hero_profile_today_bad') }}**  
                  ⭐ XP: **{{ states('sensor.josh_hero_profile_today_xp_earned') }}** · 🪙 Change: **{{ states('sensor.josh_hero_profile_today_coin_change') }}**
              - type: markdown
                content: |
                  ### 📜 Recent Activity
                  {% for i in range(1,13) %}
                  {% set raw = states('sensor.josh_hero_profile_activity' ~ i) %}
                  {% if raw not in ['unknown','unavailable',''] %}
                  {% set a = raw | from_json %}
                  {% if a.type == 'bad' %}💥{% else %}⭐{% endif %} **{{ a.title }}** — {{ '%+d' | format(a.xp | int) }} XP / {{ '%+d' | format(a.coins | int) }} 🪙  
                  {% endif %}
                  {% endfor %}

          - type: vertical-stack
            cards:
              - type: markdown
                content: |
                  ## 📊 TODAY — CHARLIE
                  ⭐ Good: **{{ states('sensor.charlie_hero_profile_today_good') }}** · 💥 Bad: **{{ states('sensor.charlie_hero_profile_today_bad') }}**  
                  ⭐ XP: **{{ states('sensor.charlie_hero_profile_today_xp_earned') }}** · 🪙 Change: **{{ states('sensor.charlie_hero_profile_today_coin_change') }}**
              - type: markdown
                content: |
                  ### 📜 Recent Activity
                  {% for i in range(1,13) %}
                  {% set raw = states('sensor.charlie_hero_profile_activity' ~ i) %}
                  {% if raw not in ['unknown','unavailable',''] %}
                  {% set a = raw | from_json %}
                  {% if a.type == 'bad' %}💥{% else %}⭐{% endif %} **{{ a.title }}** — {{ '%+d' | format(a.xp | int) }} XP / {{ '%+d' | format(a.coins | int) }} 🪙  
                  {% endif %}
                  {% endfor %}

      - type: grid
        column_span: 3
        cards:
          - type: vertical-stack
            cards:
              - type: markdown
                content: |
                  ## ⚡ CUSTOM ACTIVITY
                  Enter a parent-recorded good or bad event. It bypasses the approval queue and is applied immediately.
              - type: entities
                entities:
                  - entity: input_select.hero_custom_child
                    name: Child
                  - entity: input_select.hero_custom_type
                    name: Type
                  - entity: input_text.hero_custom_description
                    name: What happened?
                  - entity: input_number.hero_custom_points
                    name: Points
              - type: button
                name: ADD ACTIVITY
                icon: mdi:plus-circle
                tap_action:
                  action: call-service
                  service: script.hero_add_custom_activity

          - type: vertical-stack
            cards:
              - type: markdown
                content: |
                  ## ⏳ APPROVAL QUEUE
                  **{{ states('sensor.hero_mission_manager_pending_approvals') }}** missions waiting for parent approval.
              - type: entities
                entities:
                  - entity: sensor.hero_mission_manager_pending_approvals
                    name: Pending
                  - entity: sensor.hero_mission_manager_status
                    name: Status
              - type: markdown
                content: |
                  {% for i in range(1,11) %}
                  {% set raw = states('sensor.hero_mission_manager_pending' ~ i) %}
                  {% if raw not in ['unknown','unavailable',''] %}
                  {{ raw }}  
                  {% endif %}
                  {% endfor %}

          - type: vertical-stack
            cards:
              - type: markdown
                content: |
                  ## 🪙 FAMILY SNAPSHOT
                  | Hero | XP | Coins | Level |
                  |---|---:|---:|---:|
                  | 🔴 Zach | {{ states('sensor.zach_hero_profile_xp') }} | {{ states('sensor.zach_hero_profile_coins') }} | {{ states('sensor.zach_hero_profile_level') }} |
                  | 🔵 Josh | {{ states('sensor.josh_hero_profile_xp') }} | {{ states('sensor.josh_hero_profile_coins') }} | {{ states('sensor.josh_hero_profile_level') }} |
                  | 🟡 Charlie | {{ states('sensor.charlie_hero_profile_xp') }} | {{ states('sensor.charlie_hero_profile_coins') }} | {{ states('sensor.charlie_hero_profile_level') }} |
